<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal website of Manish Krishan Lal.">
  <title>Manish Krishan Lal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #23272f;
      --muted: #646b77;
      --link: #1f4fa3;
      --link-hover: #163a7a;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181a1f;
        --ink: #e4e6ea;
        --muted: #9aa1ac;
        --link: #8fb4ff;
        --link-hover: #b8cfff;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: 1.125rem;
      line-height: 1.6;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 16vh 1.5rem 4rem;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .tagline {
      margin: 0.35rem 0 0;
      font-size: 0.9375rem;
      color: var(--muted);
    }
    .tagline a { color: inherit; }
    .tagline a:hover { color: var(--ink); }
    h2 {
      margin: 2.5rem 0 0.75rem;
      font-size: 1.125rem;
      font-weight: 600;
    }
    .works {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .works li + li { margin-top: 1rem; }
    .works .meta {
      display: block;
      font-size: 0.9375rem;
      color: var(--muted);
    }
    .more { margin: 1.25rem 0 0; }
    .status {
      margin: 2.5rem 0 0;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-top: 1rem;
    }
    nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      margin-left: -0.25rem;
      color: var(--muted);
      text-decoration: none;
    }
    nav svg {
      width: 1.3rem;
      height: 1.3rem;
    }
    nav a:hover { color: var(--ink); }
    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
    }
    a:hover { color: var(--link-hover); }
    a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 3px;
      border-radius: 2px;
    }
  </style>
</head>

  <main>
    <h1>Manish Krishan Lal</h1>
    <p class="tagline">I work on <a href="https://doi.org/10.13140/RG.2.2.21223.82088">projection-based learning</a>.</p>

    <h2>Selected work</h2>

      </li>
    </ul>
